name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1' # weekly, for new queries
  workflow_dispatch:

permissions:
  contents: read

env:
  # PS4 Payload SDK release used for the build (same as build.yml)
  SDK_VERSION: v0.9

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read # a private repository needs it
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host tools and the PS4 Payload SDK
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 xxd unzip
          curl -fsSL -o sdk.zip "https://github.com/ps4-payload-dev/sdk/releases/download/${SDK_VERSION}/ps4-payload-sdk.zip"
          unzip -q sdk.zip -d "$HOME"

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - third_party
              - test/web/node_modules

      - name: Build the payload and the host tests
        if: matrix.language == 'c-cpp'
        run: |
          PS4_PAYLOAD_SDK="$HOME/ps4-payload-sdk" bash build.sh
          bash test/run.sh

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          # code scanning results of a private repository need GitHub Advanced Security:
          # analyzed there, uploaded once the repository is public
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      - name: Check that the payload sources were analyzed
        if: matrix.language == 'c-cpp'
        run: |
          zip="$RUNNER_TEMP/codeql_databases/cpp/src.zip"
          unzip -l "$zip" | grep -oE 'src/[a-z]+\.c$' | sort -u | tee analyzed.txt
          for f in main fw web pkg db origin build crypto check upload; do
            grep -qx "src/$f.c" analyzed.txt || { echo "::error::src/$f.c was not analyzed by CodeQL"; exit 1; }
          done
