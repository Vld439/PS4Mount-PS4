name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # PS4 Payload SDK release used for the build (https://github.com/ps4-payload-dev/sdk/releases)
  SDK_VERSION: v0.9

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 xxd unzip

      - name: Cache PS4 Payload SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/ps4-payload-sdk
          key: ps4-payload-sdk-${{ env.SDK_VERSION }}

      - name: Install PS4 Payload SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdk.zip "https://github.com/ps4-payload-dev/sdk/releases/download/${SDK_VERSION}/ps4-payload-sdk.zip"
          unzip -q sdk.zip -d "$HOME"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^#define VERSION "PS4Mount \(.*\)"$/\1/p' src/main.c)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION \"${version}\" in src/main.c"
            exit 1
          fi

      - name: Unit tests
        run: bash test/run.sh

      - name: Build
        run: PS4_PAYLOAD_SDK="$HOME/ps4-payload-sdk" bash build.sh

      - name: Checksum
        run: cd build && sha256sum ps4mount-ps4.elf ps4mount-ps4.bin > ps4mount-ps4.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ps4mount-ps4
          path: |
            build/ps4mount-ps4.elf
            build/ps4mount-ps4.bin
            build/ps4mount-ps4.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags and commits, for the notes

      - uses: actions/download-artifact@v4
        with:
          name: ps4mount-ps4

      - name: Release notes from the commits since the previous release
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --reverse --format='- %s' "${prev}..${GITHUB_REF_NAME}" | grep -v '^- Version '
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              git log --no-merges --reverse --format='- %s' "${GITHUB_REF_NAME}" | grep -v '^- Version '
            fi
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ps4mount-ps4.elf ps4mount-ps4.bin ps4mount-ps4.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PS4Mount-PS4 ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            $(case "${GITHUB_REF_NAME}" in *-*) echo --prerelease;; esac)
