name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. All fields marked with * are needed to find the cause.
        Do not attach `.pkg` files or links to them.
  - type: input
    id: version
    attributes:
      label: PS4Mount version
      description: Shown at the top of the web panel and in the startup notification.
      placeholder: "0.2.0-beta"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: PS4 firmware
      description: Settings > System > System Information.
      placeholder: "13.52"
    validations:
      required: true
  - type: textarea
    id: jailbreak
    attributes:
      label: Jailbreak, GoldHEN and other payloads
      description: The exploit, the GoldHEN version, how you load PS4Mount (Payload Guest, GoldHEN's autoload...) and every other payload you load.
      placeholder: |
        Lapse, GoldHEN 2.4b18
        PS4Mount from Payload Guest, AnyPad
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: Game
      description: Name and title ID (CUSAxxxxx) of the game, and whether it has an update (the version shown in the panel) and add-ons. Write "none" if the problem is not about a game.
      placeholder: "Bloodborne, CUSA00900, update 1.09, 1 add-on"
    validations:
      required: true
  - type: textarea
    id: drives
    attributes:
      label: Where the game is
      description: A USB drive (how it is formatted, how many are connected) or the console's storage (/data/pkg).
      placeholder: "1 USB SSD, exFAT, one partition"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and the exact message or error code shown on the console.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Open the web panel, click **Log** and copy the text, or download `/data/ps4mount/log.txt` over FTP. Include the part from the moment the problem happened.
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Screenshots taken on the console show more than photos of the TV.
    validations:
      required: false
