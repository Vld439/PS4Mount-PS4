<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b24"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#3d7bfd" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3d7bfd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b92ff"/>
      <stop offset="1" stop-color="#2a5fe0"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e9f5"/>
      <stop offset="1" stop-color="#aab6cc"/>
    </linearGradient>
  </defs>

  <!-- the tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- the drive: games play straight from it -->
  <rect x="211" y="56" width="90" height="70" rx="10" fill="url(#plug)"/>
  <rect x="233" y="78" width="16" height="16" rx="3" fill="#3a4458"/>
  <rect x="263" y="78" width="16" height="16" rx="3" fill="#3a4458"/>
  <rect x="166" y="118" width="180" height="200" rx="34" fill="url(#drive)"/>
  <rect x="166" y="118" width="180" height="200" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <!-- play -->
  <path d="M232 168 L232 268 L314 218 Z" fill="#f4f6fb" stroke="#f4f6fb" stroke-width="14" stroke-linejoin="round"/>

  <!-- the name -->
  <text x="256" y="420" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="74" font-weight="800" letter-spacing="-2">
    <tspan fill="#f4f6fb">PS4</tspan><tspan fill="#5b92ff">Mount</tspan>
  </text>
</svg>
